<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Frutas 🍎</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; line-height: 1.6; }
        .container { max-width: 800px; margin: auto; border: 1px solid #ddd; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 12px rgba(0,0,0,0.1); }
        h2, h3 { color: #2c3e50; }
        input { display: block; width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-guardar { background-color: #27ae60; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        .btn-guardar:hover { background-color: #219150; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; }
        #mensaje { font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🍎 Agregar Nueva Fruta</h2>
        
        <div id="formulario-fruta">
            <input type="text" id="nombre" placeholder="Nombre de la fruta (mín. 3 letras)">
            <input type="text" id="ciudad" placeholder="Ciudad de origen">
            <button class="btn-guardar" onclick="enviarDatos()">Guardar Fruta</button>
        </div>
        
        <p id="mensaje"></p>

        <hr>

        <h3>📋 Lista de Frutas</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Ciudad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-frutas">
                </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
